<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="final-page">

    <div id="confetti"></div>

    <div class="hearts">
        💖 💕 💗 💓 💕 💖
    </div>

    <main class="final-card">

        <div class="crown">
            👑
        </div>

        <h1>
            Happy Birthday!
        </h1>

        <h2>
            To My Wonderful Birthday Star ✨
        </h2>

        <p>
            May this new year of your life bring you
            countless reasons to smile, beautiful moments
            to remember, and dreams that turn into reality.
        </p>

        <p class="big-wish">
            Keep shining, keep smiling,
            and always be you. 💖
        </p>

        <div class="signature">
            With lots of love & happiness 🎀
        </div>

        <button
            class="btn"
            onclick="location.href='index.html'">

            Celebrate Again 🎉

        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
